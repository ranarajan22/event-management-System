<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/sign.css' %}">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="form" id="signup-form">
                <h2>Sign Up</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit">Sign Up</button>
                </form>
                <p class="login-prompt">Already registered? <a href="{% url 'login' %}">Log in here</a></p>
            </div>
        </div>
    </div>

    <script src="{% static 'js/sign.js' %}"></script>
</body>
</html>
