<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Website{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }
        .container {
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        footer {
            text-align: center;
            margin-top: 20px;
            color: #777;
        }
        font-family: 'Arial', sans-serif;
        background-color: #f4f4f9;
        margin: 0;
        padding: 0;
    }

    h2 {
        font-size: 2em;
        color: #333;
        margin-bottom: 1em;
        text-align: center;
    }

    /* Event List Styling */
    ul {
        list-style-type: none;
        padding: 0;
        margin: 0 auto;
        max-width: 800px;
    }

    li {
        background-color: #fff;
        border-radius: 8px;
        padding: 15px;
        margin-bottom: 20px;
        box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    li:hover {
        transform: translateY(-5px);
        box-shadow: 0 8px 12px rgba(0, 0, 0, 0.15);
    }

    /* Event Details */
    strong {
        font-size: 1.2em;
        color: #007BFF;
    }

    .event-datetime, .category-status {
        font-size: 0.9em;
        color: #666;
    }

    /* Action Links */
    a {
        color: #007BFF;
        text-decoration: none;
        margin-right: 10px;
        font-weight: bold;
        transition: color 0.2s ease-in-out;
    }

    a:hover {
        color: #0056b3;
    }

    /* Button Styling */
    button {
        background-color: #28a745;
        color: white;
        border: none;
        padding: 8px 15px;
        font-size: 1em;
        border-radius: 5px;
        cursor: not-allowed;
    }

    button:disabled {
        background-color: #ddd;
    }

    a.btn-register {
        display: inline-block;
        background-color: #007BFF;
        color: white;
        padding: 10px 20px;
        border-radius: 5px;
        font-weight: bold;
        transition: background-color 0.2s ease-in-out;
    }

    a.btn-register:hover {
        background-color: #0056b3;
    }

    /* Empty State Message */
    p {
        text-align: center;
        color: #777;
        font-size: 1.2em;
        margin-top: 30px;
    }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to Lumina</h1>
        <nav>
            {% if user.is_authenticated %}
                <!-- Dynamic Home Link -->
                {% if user.role == 'participant' %}
                    <a href="{% url 'index' %}">Home</a>
                {% else %}
                    <a href="{% url 'home' %}">Home</a>
                {% endif %}
                
                <a href="{% url 'event_list' %}">Events</a>
                <a href="{% url 'dashboard' %}">Profile</a>
                <a href="{% url 'logout' %}">Logout</a>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'signup' %}">Signup</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer>
        <p>&copy; Lumina. All Rights Reserved.</p>
    </footer>
</body>
</html>
